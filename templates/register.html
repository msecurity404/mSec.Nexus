{% extends 'base.html' %}{% block content %}
<div class="auth-box">
<h2>✨ إنشاء حساب</h2>
<form method="POST">
<label>الاسم الكامل</label><input name="fullname" required>
<label>اسم المستخدم</label><input name="username" required>
<label>البريد</label><input name="email" type="email" required>
<label>كلمة المرور</label><input name="password" type="password" required>
<button type="submit" class="btn-block" style="margin-top:10px">تسجيل</button>
</form>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<p style="text-align:center;margin-top:20px;color:var(--muted)">عندك حساب؟ <a href="/login" style="color:var(--neon)">دخول</a></p>
</div>
{% endblock %}
