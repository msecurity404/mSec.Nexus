{% extends 'base.html' %}{% block content %}
<h1>🎓 كل الكورسات</h1>
<div style="margin:20px 0"><a href="/courses" class="tag">الكل</a>
{% for c in cats %}<a href="/courses?cat={{ c[0] }}" class="tag">{{ c[0] }}</a>{% endfor %}</div>
<div class="grid">
{% for c in courses %}
<div class="card"><span class="icon">{{ c[9] }}</span><h3>{{ c[1] }}</h3>
<p style="color:var(--muted);font-size:14px">{{ c[3][:100] }}...</p>
<div class="meta"><span class="badge">{{ c[4] }}</span><span class="badge">{{ c[5] }}</span></div>
<div class="meta"><span>⭐ {{ c[11] }}</span><span>👥 {{ c[10] }}</span></div>
<div class="price">${{ c[6] }}</div>
<a href="/course/{{ c[0] }}" class="btn btn-block">عرض</a></div>
{% endfor %}</div>
{% endblock %}
